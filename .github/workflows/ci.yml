# Pipeline GitHub Actions, équivalent de .gitlab-ci.yml.
#  - apk     : APK signé en artefact (sonnuage-X.Y.Z.apk)
#  - release : sur tag vX.Y.Z, release GitHub avec l'APK
#
# Les pages viennent des sources du dépôt sonnuage, extrait à côté de celui-ci (../sonnuage), plutôt que du paquet
# NuGet : pas de registre à authentifier. Dépôt privé : définir le secret SONNUAGE_REPO_TOKEN (jeton en lecture).
# Branche ou tag du dépôt sonnuage : main par défaut, modifiable au lancement manuel.
#
# Signature (Settings > Secrets and variables > Actions) : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Mêmes valeurs que sur GitLab pour que les APK s'installent par-dessus.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      server_ref:
        description: Branche ou tag du dépôt sonnuage
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sonnuage-android
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sonnuage
          ref: ${{ inputs.server_ref || 'main' }}
          token: ${{ secrets.SONNUAGE_REPO_TOKEN || github.token }}
          path: sonnuage
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: sonnuage-android/global.json
      - name: SDK Android et workload MAUI
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          dotnet workload install maui-android
      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secrets de signature absents (ANDROID_KEYSTORE_BASE64…) : voir l'en-tête de ce fichier." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonnuage.keystore"
      - name: Build
        working-directory: sonnuage-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.v.outputs.value }}
        run: |
          dotnet publish src/SonNuage.Mobile/SonNuage.Mobile.csproj -f net10.0-android -c Release -o out \
            -p:SonNuageRepo="$GITHUB_WORKSPACE/sonnuage" -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:Version="$VERSION" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/sonnuage.keystore" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          mkdir -p dist && cp out/*-Signed.apk "dist/sonnuage-$VERSION.apk"
          rm -f "$RUNNER_TEMP/sonnuage.keystore"
          # Contrôle : l'APK publié est bien signé (sinon Android refuse de l'installer).
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "dist/sonnuage-$VERSION.apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: sonnuage-android
          path: sonnuage-android/dist/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonnuage-android
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --title "SonNuage Android ${{ needs.apk.outputs.version }}"
